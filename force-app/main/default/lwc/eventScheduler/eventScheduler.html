<template>
    <lightning-card title="Event Scheduler">
        <div class="slds-p-around_medium">
            <lightning-combobox
                name="event"
                label="Select Event"
                value={selectedEventId}
                placeholder="Select an Event"
                options={eventOptions}
                onchange={handleEventChange}>
            </lightning-combobox>

            <lightning-input
                type="search"
                label="Contact Name"
                value={contactName}
                onchange={handleContactChange}>
            </lightning-input>

            <lightning-textarea
                label="Notes"
                value={notes}
                onchange={handleNotesChange}>
            </lightning-textarea>

            <lightning-button
                variant="brand"
                label="Register"
                onclick={handleSubmit}
                class="slds-m-top_medium">
            </lightning-button>
        </div>
    </lightning-card>
</template>
