<template>
    <lightning-card title="Lightning Record Edit Form Created By PM">
        <lightning-record-edit-form object-api-name={objectApiName}
                                    density="compact"
                                    onsuccess={handleOnSuccess}>
            <lightning-input-field field-name="Id" disabled value={recordId}></lightning-input-field>
            <lightning-input-field field-name={nameField}></lightning-input-field>
            <lightning-input-field field-name={emailField}></lightning-input-field>
            <lightning-input-field field-name={phoneField}></lightning-input-field>
            <lightning-input-field field-name={typeField}></lightning-input-field>
            <lightning-input-field field-name={industryField}></lightning-input-field>
            <lightning-button label="Submit" variant="brand" type="submit"></lightning-button>
        </lightning-record-edit-form>
    </lightning-card>
</template>
